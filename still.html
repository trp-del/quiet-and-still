<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still — full app</title>
<style>
  /* ── Page chrome (not part of the plugin) ─────────────────────────────── */
  :root { --bg: #ecebe7; --fg: #26251f; --muted: #7a776d; --line: #d6d3ca; --card: #f8f7f4; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111114; --fg: #e6e4de; --muted: #8f8c84; --line: #2a2a2f; --card: #1a1a1e; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #111114; --fg: #e6e4de; --muted: #8f8c84; --line: #2a2a2f; --card: #1a1a1e; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 16px; max-width: 1440px; margin: 0 auto; }
  .bar h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .bar .hint { color: var(--muted); font-size: 12.5px; flex: 1 1 260px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; padding: 4px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); }
  .stage { max-width: 1440px; margin: 0 auto 48px; padding: 0 16px; }
  .window { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgb(0 0 0 / 0.08); }
  .scroller { overflow-x: auto; }

  /* ── Logseq stand-in: an approximation of default Logseq DB styling ──── */
  .qs-frame {
    --ls-primary-text-color: #2f2f33; --ls-primary-background-color: #ffffff; --ls-secondary-background-color: #f6f6f7;
    --ls-link-text-color: #3b6ab0; --ls-block-bullet-color: #9a9aa3; --ls-guideline-color: #e6e6ea; --ls-border-color: #e1e1e6;
    background: var(--ls-primary-background-color); color: var(--ls-primary-text-color);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    display: grid; grid-template-columns: 220px minmax(520px, 1fr) 320px; grid-template-rows: 44px 1fr;
    min-width: 1080px;
  }
  .qs-frame[data-theme="dark"] {
    --ls-primary-text-color: #d9d9de; --ls-primary-background-color: #1c1c20; --ls-secondary-background-color: #232328;
    --ls-link-text-color: #8ab0ec; --ls-block-bullet-color: #6e6e78; --ls-guideline-color: #303036; --ls-border-color: #34343b;
  }
  .qs-frame svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* header */
  .qs-frame .cp__header { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--ls-border-color); }
  .qs-frame .cp__header .btn { display: inline-flex; padding: 6px; border-radius: 6px; color: var(--ls-block-bullet-color); }
  .qs-frame .cp__header .sp { flex: 1; }
  .qs-frame .cp__header .search { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; background: var(--ls-secondary-background-color); color: var(--ls-block-bullet-color); font-size: 13px; width: 240px; }
  .qs-frame .cp__header .kbd { margin-left: auto; font-size: 11px; opacity: .8; }
  .qs-frame .sync { width: 7px; height: 7px; border-radius: 50%; background: #3aa76d; margin: 0 6px; }

  /* left sidebar */
  .qs-frame #left-sidebar { background: var(--ls-secondary-background-color); padding: 10px 8px; font-size: 13.5px; border-right: 1px solid var(--ls-border-color); }
  .qs-frame .graph-name { display: flex; align-items: center; gap: 8px; padding: 4px 8px 10px; font-weight: 600; font-size: 13px; }
  .qs-frame .graph-name .dot { width: 18px; height: 18px; border-radius: 5px; background: var(--ls-link-text-color); opacity: .8; }
  .qs-frame .nav-item { display: flex; align-items: center; gap: 9px; padding: 4px 8px; border-radius: 6px; }
  .qs-frame .nav-item.active { background: color-mix(in srgb, var(--ls-primary-text-color) 7%, transparent); }
  .qs-frame .sidebar-content-group { margin-top: 14px; }
  .qs-frame .group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 0 8px 3px; color: var(--ls-block-bullet-color); }

  /* main */
  .qs-frame #main-content-container { padding: 26px 34px 40px 26px; min-width: 0; }
  .qs-frame .page-head { display: flex; align-items: center; gap: 10px; margin: 0 0 4px 22px; }
  .qs-frame .ls-page-icon { display: inline-flex; color: var(--ls-primary-text-color); }
  .qs-frame .ls-page-icon svg.i { width: 26px; height: 26px; }
  .qs-frame .ls-page-title { font-size: 30px; font-weight: 700; line-height: 1.25; }
  .qs-frame .page-add-tags { font-size: 12px; color: var(--ls-block-bullet-color); }
  .qs-frame .page-tags { display: flex; gap: 8px; align-items: center; margin: 0 0 8px 22px; }
  .qs-frame .ls-page-properties { margin: 0 0 14px 22px; padding: 8px 12px; border-radius: 8px; background: var(--ls-secondary-background-color); font-size: 14px; display: grid; gap: 2px; }
  .qs-frame .property-pair { display: flex; gap: 12px; align-items: baseline; }
  .qs-frame .property-key { min-width: 86px; color: var(--ls-block-bullet-color); }
  .qs-frame .select-item { display: inline-flex; align-items: center; gap: 5px; }
  .qs-frame .select-item svg.i { width: 14px; height: 14px; }
  .qs-frame .ls-icon-priorityLvlUrgent { color: #e8590c; display: inline-flex; }
  .qs-frame .prop-check { display: inline-block; width: 13px; height: 13px; border: 1.5px solid var(--ls-block-bullet-color); border-radius: 3px; vertical-align: -2px; }
  .qs-frame .ls-properties-area { font-size: 13.5px; padding: 1px 0 3px 2px; }

  /* blocks */
  .qs-frame .ls-block { margin: 1px 0; border-radius: 4px; }
  .qs-frame .block-main-container { display: flex; align-items: flex-start; }
  .qs-frame .block-control-wrap { display: flex; align-items: center; height: 24px; flex-shrink: 0; }
  .qs-frame .positioned-properties.block-left { width: 0; position: relative; left: -16px; top: 4px; }
  .qs-frame .positioned-properties.block-left svg.i { width: 14px; height: 14px; }
  .qs-frame .bullet-container { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 6px 0 2px; }
  .qs-frame .bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--ls-block-bullet-color); }
  .qs-frame .bullet-container.bullet-closed { background: color-mix(in srgb, var(--ls-block-bullet-color) 30%, transparent); }
  .qs-frame .block-content-or-editor-wrap { flex: 1; min-width: 0; }
  .qs-frame .block-title-wrap { display: inline; }
  .qs-frame h2.block-title-wrap { display: block; font-size: 21px; font-weight: 700; margin: 8px 0 0; line-height: 1.4; }
  .qs-frame h3.block-title-wrap { display: block; font-size: 17px; font-weight: 700; margin: 6px 0 0; line-height: 1.4; }
  .qs-frame .block-children { margin-left: 13px; padding-left: 9px; border-left: 1px solid var(--ls-guideline-color); }
  .qs-frame .ls-block.selected { background: color-mix(in srgb, var(--ls-link-text-color) 14%, transparent); }

  /* inline */
  .qs-frame a.page-ref, .qs-frame a.tag { color: var(--ls-link-text-color); text-decoration: none; cursor: pointer; }
  .qs-frame .block-ref { border-bottom: 1px solid var(--ls-link-text-color); cursor: pointer; }
  .qs-frame a.external-link { color: var(--ls-link-text-color); text-decoration: underline; }
  .qs-frame code { background: var(--ls-secondary-background-color); border: 1px solid var(--ls-border-color); border-radius: 4px; padding: 0 .3em; font-size: .86em; font-family: ui-monospace, Menlo, monospace; }
  .qs-frame mark { background: #fbe78c; color: #222; }
  .qs-frame[data-theme="dark"] mark { background: #6a5a1a; color: inherit; }
  .qs-frame .ls-blockquote { margin: 4px 0; padding: 6px 12px; border-left: 3px solid var(--ls-link-text-color); background: var(--ls-secondary-background-color); border-radius: 0 6px 6px 0; }
  .qs-frame .cp__fenced-code-block { margin: 4px 0; padding: 10px 12px; background: var(--ls-secondary-background-color); border: 1px solid var(--ls-border-color); border-radius: 6px; font: 13px/1.55 ui-monospace, Menlo, monospace; white-space: pre; overflow-x: auto; }
  .qs-frame .cp__fenced-code-block .k { color: #a2408a; } .qs-frame .cp__fenced-code-block .s { color: #3a7d44; } .qs-frame .cp__fenced-code-block .c { opacity: .55; }
  .qs-frame[data-theme="dark"] .cp__fenced-code-block .k { color: #d78fc7; } .qs-frame[data-theme="dark"] .cp__fenced-code-block .s { color: #8cc795; }
  .qs-frame .ls-datetime, .qs-frame .timestamp { white-space: nowrap; }

  /* tasks */
  .qs-frame .ui__checkbox { display: inline-block; width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px; border: 1.5px solid; border-radius: 3px; color: var(--ls-block-bullet-color); position: relative; }
  .qs-frame .ui__checkbox.checked { background: currentColor; }
  .qs-frame .ui__checkbox.checked::after { content: ""; position: absolute; left: 3.5px; top: .5px; width: 4px; height: 8px; border: solid var(--ls-primary-background-color); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  .qs-frame .done-text { text-decoration: line-through; }
  .qs-frame .canceled { text-decoration: line-through; opacity: .6; }

  /* editing */
  .qs-frame .editor-inner { display: block; width: 100%; padding: 1px 6px; margin-left: -6px; border-radius: 4px; background: color-mix(in srgb, var(--ls-primary-text-color) 4%, transparent); font: inherit; }
  .qs-frame .caret { display: inline-block; width: 1.5px; height: 1.1em; vertical-align: -3px; background: var(--ls-link-text-color); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* tags row & views */
  .qs-frame .block-tags { display: inline-flex; gap: 4px; margin-left: 6px; font-size: 13px; }
  /* Logseq's own tag row: "#" is a separate link, and both links sit at 70% */
  .qs-frame .block-tag { display: inline-flex; }
  .qs-frame .block-tag :is(a.tag, a.hash-symbol) { opacity: .7; }
  .qs-frame .ls-table { margin: 4px 0 6px; border: 1px solid var(--ls-border-color); border-radius: 8px; overflow: hidden; font-size: 14px; }
  .qs-frame .ls-view-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--ls-border-color); color: var(--ls-block-bullet-color); font-size: 13px; }
  .qs-frame .ls-view-head .t { color: var(--ls-primary-text-color); font-weight: 600; margin-right: auto; }
  .qs-frame .ls-table-row { display: grid; grid-template-columns: 1fr 110px 120px; border-bottom: 1px solid var(--ls-border-color); }
  .qs-frame .ls-table-row:last-child { border-bottom: 0; }
  .qs-frame .ls-table-header-cell, .qs-frame .ls-table-cell { padding: 5px 10px; border-right: 1px solid var(--ls-border-color); }
  .qs-frame .ls-table-header-cell:last-child, .qs-frame .ls-table-cell:last-child { border-right: 0; }
  .qs-frame .ls-table-header-cell { font-weight: 600; font-size: 13px; background: var(--ls-secondary-background-color); }

  /* embeds & references */
  .qs-frame .embed-page { margin: 4px 0; padding: 6px 10px; border: 1px solid var(--ls-border-color); border-radius: 8px; background: var(--ls-secondary-background-color); }
  .qs-frame .embed-header { font-weight: 600; margin-bottom: 2px; }
  .qs-frame .references { margin: 26px 0 0 22px; padding-top: 12px; border-top: 1px solid var(--ls-border-color); }
  .qs-frame .ref-h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .qs-frame .ref-h .filter { margin-left: auto; color: var(--ls-block-bullet-color); }
  .qs-frame .ref-group { margin-bottom: 10px; }
  .qs-frame .breadcrumb { font-size: 13px; color: var(--ls-block-bullet-color); margin-bottom: 1px; }
  .qs-frame .unlinked-references { margin: 16px 0 0 22px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  /* right sidebar */
  .qs-frame #right-sidebar { border-left: 1px solid var(--ls-border-color); background: var(--ls-primary-background-color); font-size: 14px; }
  .qs-frame .cp__right-sidebar-topbar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--ls-border-color); color: var(--ls-block-bullet-color); font-size: 13px; }
  .qs-frame .cp__right-sidebar-topbar .tab { padding: 2px 8px; border-radius: 5px; }
  .qs-frame .cp__right-sidebar-topbar .tab.on { background: var(--ls-secondary-background-color); color: var(--ls-primary-text-color); }
  .qs-frame .sidebar-item { margin: 10px 10px 0; padding-bottom: 8px; border-bottom: 1px solid var(--ls-border-color); }
  .qs-frame .sidebar-item-header { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; background: var(--ls-secondary-background-color); font-weight: 600; font-size: 13.5px; }
  .qs-frame .sidebar-item-header .x { margin-left: auto; color: var(--ls-block-bullet-color); }
  .qs-frame .sidebar-item .body { padding: 6px 2px 0; }
  .qs-frame .journal-title { font-size: 17px; font-weight: 700; margin: 2px 0 4px 22px; }
</style>
<script src="dist/preview.js"></script>
</head>
<body>
<div class="bar">
  <h1>Still: full app</h1>
  <div class="seg" id="mode"><button data-v="still">Still</button><button data-v="baseline">Baseline</button></div>
  <div class="seg" id="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  <div class="hint">Hover the sidebars, header, properties or references to see them come back. The block with the blinking caret is in edit mode, so its properties stay at full volume.</div>
</div>
<div class="stage"><div class="window"><div class="scroller"><div class="qs-frame qs-on" data-system="still" id="app"></div></div></div></div>
<style id="qs-generated"></style>

<script>
  const P = {
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    left: '<path d="M15 6l-6 6 6 6"/>', right: '<path d="M9 6l6 6-6 6"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    panel: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M15 5v14"/>',
    cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    cards: '<rect x="6" y="4" width="13" height="16" rx="2"/><path d="M3 7v11a2 2 0 0 0 2 2"/>',
    graph: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="10" cy="18" r="2"/><path d="M8 7l8 1M7 8l2 8M12 17l5-7"/>',
    pages: '<path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/>', tag: '<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8" cy="8" r="1"/>',
    lantern: '<path d="M9 4h6M10 4v2M14 4v2"/><path d="M8 8h8l1 10H7z"/><path d="M12 11v4"/><path d="M9 20h6"/>',
    doing: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
    filter: '<path d="M4 6h16M7 12h10M10 18h4"/>', sort: '<path d="M8 5v14M5 16l3 3 3-3M16 19V5M13 8l3-3 3 3"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>', chev: '<path d="M9 6l6 6-6 6"/>',
    dot: '<circle cx="12" cy="12" r="5" fill="currentColor"/>',
    urgent: '<rect x="4" y="13" width="3" height="6" fill="currentColor"/><rect x="10.5" y="9" width="3" height="10" fill="currentColor"/><rect x="17" y="5" width="3" height="14" fill="currentColor"/>',
  };
  const i = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;

  const blockTag = (t) => `<span class="block-tag"><a class="hash-symbol">#</a><a class="tag"><span>${t}</span></a></span>`;
  // Block helper: opts = { left, closed, cls, props, children, tags }
  const block = (title, o = {}) => `
    <div class="ls-block ${o.cls || ""}"><div class="block-main-container">
      ${o.left ? `<div class="positioned-properties block-left">${o.left}</div>` : ""}
      <div class="block-control-wrap"><span class="bullet-container ${o.closed ? "bullet-closed" : ""}"><span class="bullet"></span></span></div>
      <div class="block-content-or-editor-wrap"><div class="block-content">
        ${title}${o.tags ? `<span class="block-tags">${o.tags.map((t) => blockTag(t)).join("")}</span>` : ""}
        ${o.props ? `<div class="ls-properties-area">${o.props.map(([k, v]) => `<div class="property-pair"><span class="property-key">${k}</span><span class="property-value">${v}</span></div>`).join("")}</div>` : ""}
      </div></div>
    </div>${o.children ? `<div class="block-children-container"><div class="block-children">${o.children.join("")}</div></div>` : ""}</div>`;
  const t = (html) => `<div class="block-title-wrap">${html}</div>`;
  const ref = (s) => `<a class="page-ref">${s}</a>`;
  const tag = (s) => `<a class="tag">#${s}</a>`;
  const date = (s) => `<span class="ls-datetime">${s}</span>`;
  const nav = (icon, label, active) => `<div class="nav-item ${active ? "active" : ""}">${i(icon)}${label}</div>`;

  document.getElementById("app").innerHTML = `
    <div class="cp__header">
      <span class="btn">${i("menu")}</span><span class="btn">${i("left")}</span><span class="btn">${i("right")}</span>
      <span class="sp"></span>
      <span class="search">${i("search")}Search<span class="kbd">⌘K</span></span>
      <span class="sync" title="synced"></span>
      <span class="btn">${i("plus")}</span><span class="btn">${i("bell")}</span><span class="btn">${i("dots")}</span><span class="btn">${i("panel")}</span>
    </div>

    <div id="left-sidebar">
      <div class="sidebar-header-container">
        <div class="sidebar-graphs graph-name"><span class="dot"></span>lantern-notes</div>
        <div class="sidebar-content-group"><div class="sidebar-content-group-inner"><div class="hd group-h">Navigations</div>
          <div class="bd"><div class="sidebar-navigations">
            ${nav("cal", "Journals")}${nav("cards", "Flashcards")}${nav("graph", "Graph view")}${nav("pages", "All pages")}${nav("tag", "Tags")}
          </div></div>
        </div></div>
      </div>
      <div class="sidebar-content-group"><div class="sidebar-content-group-inner"><div class="hd group-h">Favorites</div>
        <div class="bd">${nav("lantern", "Lantern", true)}${nav("pages", "Reading list")}${nav("pages", "Principles")}</div>
      </div></div>
      <div class="sidebar-content-group"><div class="sidebar-content-group-inner"><div class="hd group-h">Recent</div>
        <div class="bd">${nav("pages", "Q1 Plan")}${nav("pages", "Mara Ito")}${nav("cal", "Nov 2, 2026")}</div>
      </div></div>
    </div>

    <div id="main-content-container">
      <div class="page-head"><span class="ls-page-icon">${i("lantern")}</span><span class="ls-page-title">Lantern</span></div>
      <div class="page-tags"><span class="block-tags" style="margin:0">${blockTag("Project")}</span><span class="page-add-tags">+ Add tag</span></div>
      <div class="ls-page-properties">
        <div class="property-pair"><span class="property-key">status</span><span class="property-value"><span class="property-value-inner"><span class="select-item"><span class="ls-icon-color-wrap" style="color:#2f9e5e;display:inline-flex">${i("dot")}</span>Active</span></span></span></div>
        <div class="property-pair"><span class="property-key">owner</span><span class="property-value">${ref("Mara Ito")}</span></div>
        <div class="property-pair"><span class="property-key">deadline</span><span class="property-value">${date("Dec 1, 2026")}</span></div>
        <div class="property-pair"><span class="property-key">budget</span><span class="property-value"><span class="ls-number">40,000</span></span></div>
        <div class="property-pair"><span class="property-key">site</span><span class="property-value"><a class="external-link">lantern.example.com</a></span></div>
        <div class="property-pair"><span class="property-key">archived</span><span class="property-value"><span class="prop-check"></span></span></div>
      </div>

      ${block(t(`Kickoff with ${ref("Mara Ito")} about the ${ref("Lantern")} budget ${tag("meeting")}`),
        { props: [["date", date("Nov 3, 2026")], ["attendees", `${ref("Mara Ito")}, ${ref("Jun Park")}`]] })}
      ${block(t(`<span class="ui__checkbox"></span>Draft the outline for ${ref("Q1 Plan")}; see <span class="block-ref">budget capped at 40k until review</span>`),
        { left: i("doing"), props: [["priority", `<span class="property-value-inner"><span class="select-item"><span class="ls-icon-priorityLvlUrgent">${i("urgent")}</span>Urgent</span></span>`], ["deadline", date("Nov 20, 2026")]] })}
      ${block(t(`<span class="ui__checkbox"></span>Confirm caterer headcount with ${ref("Jun Park")}`))}
      ${block(t(`<span class="ui__checkbox checked"></span><span class="done-text">Book the venue for <span class="timestamp">Nov 14</span></span>`))}
      ${block(t(`<span class="ui__checkbox"></span><span class="canceled">Print paper invites</span>`))}

      ${block(`<h2 class="block-title-wrap as-heading">Notes</h2>`, { children: [
        block(t(`Run <code>npm run build</code> before <mark>the demo</mark>; notes at <a class="external-link">example.com/lantern</a>`)),
        block(`<div class="ls-blockquote">Make the light small enough to carry, and bright enough to read by.</div>`),
        block(`<div class="cp__fenced-code-block"><span class="c">// warm-up before the demo</span>

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let theme = store.get("qs-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  let mode = store.get("qs-still-mode", "still");
  const app = document.getElementById("app");

  for (const [id, set] of [["theme", (v) => (theme = v)], ["mode", (v) => (mode = v)]]) {
    document.getElementById(id).addEventListener("click", (ev) => {
      const v = ev.target.dataset.v; if (!v) return;
      set(v); store.set(id === "theme" ? "qs-theme" : "qs-still-mode", v); render();
    });
  }

  function render() {
    document.documentElement.dataset.theme = theme;
    app.dataset.theme = theme;
    app.classList.toggle("qs-on", mode === "still");
    document.querySelectorAll(".seg button").forEach((b) =>
      b.setAttribute("aria-pressed", b.dataset.v === theme || b.dataset.v === mode));
    document.getElementById("qs-generated").textContent =
      QS.tokens("still", '.qs-frame[data-system="still"]', '.qs-frame[data-system="still"][data-theme="dark"]') + "\n" +
      QS.elements(QS.ELEMENTS.filter((e) => e.on).map((e) => e.id), ".qs-frame.qs-on");
  }
  render();
</script>
